{{define "title"}} Error {{end}}
{{define "body"}}

    <style>
        .button {
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }

        .button1 {background-color: #04AA6D;} /* Green */
        .button2 {background-color: #008CBA;} /* Blue */
    </style>

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1>Error</h1>
            <p>{{.Message}}</p>
        </div>
            {{ if .AuthError }}

                <a href="/login">
                    <input type="button" class="button button1" value="Log in" />
                </a>
                <a href="/signup">
                    <input type="button" class="button button2" value="Sign up" />
                </a>
            {{end}}
    </div>

</div>
{{end}}
