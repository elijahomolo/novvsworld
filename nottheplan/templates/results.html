{{define "title"}} Results {{end}}


{{define "body"}}
    <h2>{{.Title}}</h2>
{{range .Commissions}}
    <table>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Location</th>
        </tr>
        <tr>
            <td>{{.Name}}</td>
            <td>{{.Description}}</td>
            <td>{{.Location}}</td>
            <td>
                <form action="/commissions/entry" method="get">
                    <input type="hidden" name="id" value="{{.ID}}">
                <button type="submit">Submit Entry</button>
                </form>
            </td>
        </tr>
    </table>

    {{ end}}
{{end}}
